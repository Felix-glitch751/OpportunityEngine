name: Opportunity Engine Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: opportunity-engine-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear carpeta de datos
        run: mkdir -p Data

      - name: Recuperar base de datos
        uses: actions/cache@v4
        with:
          path: Data/opportunities.db
          key: opportunity-db-${{ github.run_id }}
          restore-keys: |
            opportunity-db-

      - name: Ejecutar Opportunity Engine
    env:
    TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  run: python main.py